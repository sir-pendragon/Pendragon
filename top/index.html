<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 下書き: 公開前に noindex を削除すること -->
<link rel="preload" as="image" href="title-logo.webp" type="image/webp">
<meta name="robots" content="noindex, nofollow">
<title>デザイナーズ『裏』ノート | 日本巡る自転車旅</title>
<meta name="description" content="日本巡る自転車旅の「デザイナーズ『裏』ノート」。YouTube・マイアルバム・noteへのリンクをまとめています。">
<style>
  /* ---------- 基本 ---------- */
  :root{
    --bg:#2a1f17; --bg-2:#34271d;
    --card:#43331f; --card-hover:#523f27; --line:#6b5236;
    --text:#f3e8d4; --muted:#bfae92; --accent:#e0b25a;
    --yt:#e5483f; --album:#c9488a; --note:#4fb8a0;
    --gap:14px; --radius:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;position:relative;overflow-x:hidden;min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -200px,#4a3826 0%,var(--bg) 60%);
    color:var(--text);line-height:1.6;
    font-family:"Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  }
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:16px 16px 48px}

  /* ---------- 紋章(右上に大きく。上端・右端は切れる。左下1/4は透過30%はSVG側のマスク) ---------- */
  .crest-layer{
    --d:clamp(240px,62vw,460px);
    position:absolute;inset:0 0 auto;height:900px;
    overflow:hidden;pointer-events:none;z-index:0;
  }
  .crest{
    position:absolute;width:var(--d);height:var(--d);
    top:calc(var(--d) * -.34);right:calc(var(--d) * -.35);
  }
  .crest path{stroke:var(--accent)}

  /* ---------- ヘッダー・タブ ---------- */
  .back{display:inline-flex;align-items:center;gap:8px;margin:4px 0;padding:4px 12px 4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);color:var(--accent);text-decoration:none;-webkit-tap-highlight-color:transparent}
  .back-wrap{display:inline-flex;flex-direction:column;align-items:stretch}
  .back-wrap .back{margin-bottom:0}
  .back-cap{margin-top:4px;color:var(--accent);font-size:12px;line-height:1.3;text-align:center;text-decoration:none;white-space:nowrap}
  .back-cap:hover{text-decoration:underline}
  .back .arrow{font-size:18px;line-height:1}
  .back img{display:block;height:44px;width:auto}
  .back:hover{border-color:var(--accent);background:var(--card)}
  .back:focus-visible,.tab-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  header{text-align:center;padding:16px 0 24px}
  header h1{margin:0}
  .title-logo{display:block;width:min(560px,86%);height:auto;margin:0 auto}
  header p{margin:8px 0 0;color:var(--muted);font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 24px}
  .tab{
    padding:8px 16px;border:1px solid var(--line);border-radius:999px;
    background:var(--bg-2);color:var(--text);font-size:14px;cursor:pointer;
  }
  .tab-x{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#000;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .share-msg{margin:-12px 0 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
  .share-msg[hidden],.share-prev[hidden]{display:none}
  .share-prev{margin:-10px 0 20px;text-align:center}
  .share-prev img{display:inline-block;width:160px;height:auto;border-radius:8px;border:1px solid var(--line);cursor:grab}
  .tab-x img{display:block;width:16px;height:auto}
  .tab-x:hover{border-color:var(--accent)}
  .tab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--bg);font-weight:700}

  /* ---------- セクション見出し(--c で種類ごとの色) ---------- */
  section{--c:var(--accent);margin:0 0 32px}
  section[data-kind="youtube"]{--c:var(--yt)}
  section[data-kind="album"]{--c:var(--album)}
  section[data-kind="note"]{--c:var(--note)}
  .sec-head{display:flex;align-items:center;gap:12px;margin:0 0 12px}
  .sec-head h2{margin:0}
  .shuffle-btn{padding:6px 12px;border:1px solid var(--c);border-radius:999px;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .shuffle-btn:active{background:rgba(255,255,255,.12)}
  section h2{margin:0 0 12px;padding-left:12px;border-left:4px solid var(--c);font-size:18px}
  .empty{color:var(--muted);font-size:14px}

  /* ---------- カード共通 ---------- */
  .grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{
    display:flex;flex-direction:column;overflow:hidden;
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);color:inherit;text-decoration:none;
    transition:transform .15s,background .15s;
  }
  a.card:hover{background:var(--card-hover);transform:translateY(-2px)}
  .card.soon{opacity:.6;cursor:default}
  .thumb{
    position:relative;display:flex;align-items:center;justify-content:center;
    aspect-ratio:16/9;background:#1f1610 center/cover no-repeat;
  }
  .thumb.noimg.youtube{background:linear-gradient(135deg,#5a2a25,#2a1f17)}
  .thumb.noimg.note{background:linear-gradient(135deg,#1f4a40,#2a1f17)}
  .thumb .ph{color:var(--muted);font-size:13px}
  .badge{
    position:absolute;left:6px;top:6px;padding:1px 6px;border-radius:3px;
    color:#fff;font-size:10px;font-weight:700;
  }
  .badge.youtube{background:var(--yt)}
  .badge.note{background:var(--note);color:#12312a}
  .play{
    display:flex;align-items:center;justify-content:center;
    width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);
  }
  .play::after{
    content:"";margin-left:4px;
    border-left:16px solid #fff;border-block:10px solid transparent;
  }
  .body{padding:12px 14px 14px}
  .body h3{margin:0 0 4px;font-size:15px}
  .body p{margin:0;color:var(--muted);font-size:13px}

  /* ---------- YouTube: メイン1枚を大きく、残りをやや小さく ---------- */
  /* スマホ: メインは全幅、残り4枚は2列×2段 */
  .grid.feature{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
  .grid.feature .card.main{grid-column:1 / -1}
  .grid.feature .body h3{font-size:12px;font-weight:600;line-height:1.5}
  .grid.feature .card.main .body h3{font-size:15px}
  .grid.feature .card:not(.main) .body{padding:10px 12px}

  /* マイアルバム: 2行×4枚（スマホもPCも4列）。押すと大きく表示 */
  .album-grid{display:grid;gap:var(--gap);grid-template-columns:repeat(4,minmax(0,1fr))}
  .album-item{display:block;padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:#2a1f17;cursor:zoom-in}
  .album-item img{width:100%;height:100%;object-fit:cover;display:block}
  .album-pop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.88);padding:16px;cursor:zoom-out}
  .album-pop[hidden]{display:none}
  .album-pop img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  .album-pop .x{position:absolute;top:10px;right:14px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:1;cursor:pointer}

  /* ---------- note: 公式埋め込み(iframe) ---------- */
  /* 1行のカルーセル: 横スワイプ、または左右の ＜ ＞ で1ページずつ。スマホは1件、PC(700px以上)は2件ずつ見える */
  .note-carousel{position:relative}
  .note-track{display:flex;gap:var(--gap);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .note-track::-webkit-scrollbar{display:none}
  .note-track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .note-slide{flex:0 0 100%;min-width:0;scroll-snap-align:start}
  .note-slide iframe.note-embed{width:100% !important;max-width:100% !important}
  .note-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:rgba(42,31,23,.88);color:var(--text);font-size:20px;line-height:1;cursor:pointer;padding:0}
  .note-nav.prev{left:4px}
  .note-nav.next{right:4px}
  .note-nav[hidden]{display:none}

  /* ---------- 3Dビューア(iframe) ---------- */
  .viewer-box{max-width:100%}
  .viewer-frame{display:block;width:100%;max-width:100%;height:700px;border:0;border-radius:12px;background:#1f1610}
  .viewer-link{margin:10px 0 0;font-size:14px}
  .viewer-link a{color:var(--accent)}
  @media (max-width:699px){ .viewer-frame{height:clamp(460px,78vh,640px)} }
  @supports (height:1svh){ @media (max-width:699px){ .viewer-frame{height:clamp(460px,78svh,640px)} } }

  /* ---------- フッター ---------- */
  footer{
    margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;text-align:center;
  }

  .settings-link{display:inline-block;margin-bottom:10px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font-size:13px}
  .settings-link[hidden]{display:none}
  .settings-link:hover{color:var(--text);border-color:var(--accent)}

  @media (min-width:700px){ .note-slide{flex-basis:calc((100% - var(--gap)) / 2)} }

  /* ---------- PC(1024px以上) ---------- */
  @media (min-width:1024px){
    /* YouTube: 横1列に5枚。小さい4枚は4:3のサムネ+3行ぶんの本文で高さが決まり、
       メインのサムネが残りの高さを埋める(余白を作らず下端をそろえる) */
    .grid.feature{grid-template-columns:1.6fr repeat(4,minmax(0,1fr));align-items:stretch}
    .grid.feature .card.main{grid-column:auto}
    .grid.feature .card:not(.main) .thumb{aspect-ratio:4/3}
    .grid.feature .card:not(.main) .body{flex:1;min-height:calc(3 * 1.5 * 12px + 20px)}
    .grid.feature .card.main .thumb{aspect-ratio:auto;flex:1 1 0;min-height:0}
    .grid.feature .card.main .body{flex:none}
    

  }
</style>
</head>

<script>
/* ============================================================
   リンクの追加方法: ITEMS に1行ずつ足すだけです。
   kind   : "youtube" | "note"
   title  : カードの見出し
   desc   : 短い説明(省略可)
   url    : リンク先(https:// で始まるもの)。空欄なら「準備中」表示
   ytId   : YouTube動画ID(kind が youtube のとき。サムネイルを自動表示)
   main   : true を付けた1件は、YouTube欄で大きく表示(YouTubeのみ)
   thumb  : 画像のURLまたはパス(note で画像を出したいとき。省略可)
   ※ マイアルバムは下の ALBUM に、写真のファイル名(top/album/ に置く)を書きます。
   ※ note の記事は top/note/notes.json(記事IDの配列)にあります。追加・削除・並べ替えは設定画面(admin/)から行えます。
   ============================================================ */
const ITEMS = [
  { kind:"youtube",   title:"チタン製14インチで本格ロードバイクを目指す！ 【前編】", url:"https://youtu.be/6Kh9uR2zCIg", ytId:"6Kh9uR2zCIg", main:true },
  { kind:"youtube",   title:"Titanium Mini Velo Mod: Disc Brake Upgrade", url:"https://youtu.be/32V6wl-Hv6k", ytId:"32V6wl-Hv6k" },
  { kind:"youtube",   title:"Dream Build Gravel Bike Titanium 3D Frame with SR13", url:"https://youtu.be/To2L_A_9Lzw", ytId:"To2L_A_9Lzw" },
  { kind:"youtube",   title:"【焚き火台26台】My焚き火台の変遷", url:"https://youtu.be/5_kc2WdOxLc", ytId:"5_kc2WdOxLc" },
  { kind:"youtube",   title:"薪ストーブ【998g】WINNERWELL チタン製", url:"https://youtu.be/S_-1l83HSbc", ytId:"S_-1l83HSbc" },
];

const KINDS = [
  { id:"youtube",   label:"YouTube" },
  { id:"album",     label:"マイアルバム" },
  { id:"note",      label:"note" },
  { id:"viewer",    label:"3Dビューア", heading:"PENDRAGON Titanium Coupler Project" }
];
const VIEWER_URL = "https://pendragon-3-viewer.vercel.app/viewers/titaniumgr-bicycle/bike";
const VIEWER_NAME = "PENDRAGON Titanium Coupler Project";


/* ============================================================
   マイアルバム: 写真の一覧は top/album/album.json(ファイル名の配列)にあります。
   写真本体は top/album/NN.jpg(長辺1600px程度)、一覧用の小さい正方形(360px)は top/album/t/NN.jpg です。
   追加・削除は設定画面(admin/)から行えます。手で足すときは album.json にファイル名を足してください。
   ページを開くたびにランダムで8枚(2行×4枚)を選びます。一覧が空の間は項目ごと表示されません。
   ============================================================ */
let ALBUM = [];
function loadAlbum(){
  return fetch("album/album.json",{cache:"no-cache"})
    .then(r => r.ok ? r.json() : [])
    .then(a => { ALBUM = Array.isArray(a) ? a.filter(f => typeof f === "string" && /^album\/[A-Za-z0-9_-]+\.jpg$/.test(f)) : []; })
    .catch(() => { ALBUM = []; });
}
const ALBUM_SHOW = 8;
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function activeKinds(){ return KINDS.filter(k => k.id !== "album" || ALBUM.length > 0); }

function buildAlbum(){
  const grid = el("div","album-grid");
  shuffled(ALBUM).slice(0, ALBUM_SHOW).forEach(src=>{
    const b = el("button","album-item");
    b.type = "button"; b.setAttribute("aria-label","写真を大きく表示");
    const im = new Image();
    im.src = src.replace("album/","album/t/"); im.loading = "lazy"; im.decoding = "async"; im.width = 360; im.height = 360; im.alt = "";
    im.onerror = ()=> b.remove();
    b.appendChild(im);
    b.addEventListener("click",()=> openAlbum(src));
    grid.appendChild(b);
  });
  return grid;
}

let albumPop = null;
function openAlbum(src){
  if(!albumPop){
    albumPop = el("div","album-pop");
    albumPop.hidden = true;
    albumPop.setAttribute("role","dialog"); albumPop.setAttribute("aria-label","写真");
    albumPop.appendChild(document.createElement("img"));
    const x = el("button","x","×"); x.type = "button"; x.setAttribute("aria-label","閉じる");
    albumPop.appendChild(x);
    albumPop.addEventListener("click",closeAlbum);
    document.addEventListener("keydown",e=>{ if(e.key === "Escape") closeAlbum(); });
    document.body.appendChild(albumPop);
  }
  albumPop.firstChild.src = src;
  albumPop.hidden = false;
}
function closeAlbum(){ if(albumPop) albumPop.hidden = true; }

/* ============================================================
   note: 公式の埋め込みを使います。
   記事ID は、埋め込みコードの src="https://note.com/embed/notes/【ここ】" の部分です。
   ============================================================ */
let NOTE_IDS = [];
function loadNotes(){
  return fetch("note/notes.json",{cache:"no-cache"})
    .then(r => r.ok ? r.json() : [])
    .then(a => { NOTE_IDS = Array.isArray(a) ? a.filter(i => typeof i === "string" && /^n[a-z0-9]{6,30}$/.test(i)) : []; })
    .catch(() => { NOTE_IDS = []; });
}
const noteGrid = document.createElement("div");   // カルーセル全体(横1列)
noteGrid.className = "note-carousel";
const noteTrack = document.createElement("div");
noteTrack.className = "note-track"; noteTrack.tabIndex = 0;
noteTrack.setAttribute("role","region"); noteTrack.setAttribute("aria-label","noteの記事(左右にスワイプ、または矢印キー)");
const notePrev = el("button","note-nav prev","＜"), noteNext = el("button","note-nav next","＞");
notePrev.type = noteNext.type = "button";
notePrev.setAttribute("aria-label","前の記事"); noteNext.setAttribute("aria-label","次の記事");
function noteStep(dir){
  const s = noteTrack.querySelector(".note-slide"); if(!s) return;
  const gap = parseFloat(getComputedStyle(noteTrack).columnGap) || 0;
  const per = Math.max(1, Math.round((noteTrack.clientWidth + gap) / (s.offsetWidth + gap)));   // 1ページ = 見えている件数
  noteTrack.scrollBy({ left: dir * per * (s.offsetWidth + gap), behavior: "smooth" });
}
function noteNavUpdate(){
  const max = noteTrack.scrollWidth - noteTrack.clientWidth;
  notePrev.hidden = noteTrack.scrollLeft <= 2;
  noteNext.hidden = noteTrack.scrollLeft >= max - 2;
}
notePrev.addEventListener("click",()=> noteStep(-1));
noteNext.addEventListener("click",()=> noteStep(1));
noteTrack.addEventListener("scroll",noteNavUpdate,{passive:true});
noteTrack.addEventListener("keydown",e=>{
  if(e.key === "ArrowLeft"){ e.preventDefault(); noteStep(-1); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); noteStep(1); }
});
window.addEventListener("resize",noteNavUpdate);
noteGrid.append(noteTrack, notePrev, noteNext);
function fillNoteGrid(){
  NOTE_IDS.forEach(id=>{
    const slide = el("div","note-slide");
    const f = document.createElement("iframe");
    f.className = "note-embed"; f.loading = "lazy";
    f.src = "https://note.com/embed/notes/" + id;
    f.setAttribute("height","400");
    f.setAttribute("title","noteの記事");
    f.style.cssText = "border:0;display:block;max-width:99%;width:494px;padding:0;margin:10px 0;position:static;visibility:visible;";
    slide.appendChild(f);
    noteTrack.appendChild(slide);
  });
}
/* 3Dビューア: 公開ページをそのまま iframe で読み込む(コピー・再実装はしない。「分割」「走行」はビューア内のボタンを使う) */
function buildViewer(){
  const box = el("div","viewer-box");
  const f = document.createElement("iframe");
  f.className = "viewer-frame";
  f.src = VIEWER_URL; f.title = VIEWER_NAME; f.loading = "lazy";
  f.setAttribute("allow","fullscreen"); f.setAttribute("allowfullscreen","");
  box.appendChild(f);
  const p = el("p","viewer-link");
  const a = el("a",null,"3Dビューアを別画面で開く");
  a.href = VIEWER_URL; a.target = "_blank"; a.rel = "noopener";
  p.appendChild(a);
  box.appendChild(p);
  return box;
}
function buildNote(){
  if(!noteTrack.children.length) return el("p","empty","まだ記事がありません。");
  requestAnimationFrame(noteNavUpdate);
  return noteGrid;
}
function loadNoteScript(){
  if(!noteTrack.children.length || document.getElementById("note-embed-js")) return;
  const sc = document.createElement("script");
  sc.id = "note-embed-js"; sc.async = true; sc.charset = "utf-8";
  sc.src = "https://note.com/scripts/embed.js";
  document.body.appendChild(sc);
}

const state = { filter:"all" };

function safeUrl(u){
  try{
    const x = new URL(u);
    return (x.protocol === "https:" || x.protocol === "http:") ? x.href : "";
  }catch(e){ return ""; }
}
function ytId(s){ return /^[A-Za-z0-9_-]{6,20}$/.test(s||"") ? s : ""; }

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

function buildCard(it){
  const href = safeUrl(it.url);
  const card = href ? el("a","card") : el("div","card soon");
  if(it.main) card.classList.add("main");
  if(href){
    card.href = href;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
  }

  const thumb = el("div","thumb " + it.kind);
  let img = "";
  if(it.kind === "youtube" && ytId(it.ytId)){
    img = "https://img.youtube.com/vi/" + ytId(it.ytId) + "/hqdefault.jpg";
  }else if(it.thumb){
    img = it.thumb;
  }
  if(img){
    thumb.style.backgroundImage = "url('" + img.replace(/'/g,"%27") + "')";
  }else{
    thumb.classList.add("noimg");
    thumb.appendChild(el("span","ph", href ? "" : "準備中"));
  }
  const label = KINDS.find(k => k.id === it.kind);
  thumb.appendChild(el("span","badge " + it.kind, label ? label.label : it.kind));
  if(it.kind === "youtube" && href) thumb.appendChild(el("span","play"));
  card.appendChild(thumb);

  const body = el("div","body");
  body.appendChild(el("h3",null,it.title));
  if(it.desc) body.appendChild(el("p",null,it.desc));
  card.appendChild(body);
  return card;
}

/* ---------- Xで共有(GIFつき) ----------
   X の投稿画面を開くリンクには、画像や GIF を付ける仕組みがありません。そのため、
   ・スマホなど共有機能(Web Share)が使える端末: GIF と文章をまとめて共有 → 共有先に X を選ぶ
   ・使えない端末(多くのPC): GIF を保存して X の投稿画面を開く → 画面で GIF を添付
   のどちらかになります。GIF(約3.5MB)は、ボタンに触れたときに初めて読み込みます。 */
const SHARE_URL = "https://jitensha-tabi.com/top/";
const SHARE_TEXT = "デザイナーズ裏ノート\n\n作者の動画や画像や記事をまとめました\nオリジナル分割チタングラベルも開発中！\n3Dビューア公開してます\n\n" + SHARE_URL + "\n\n#自転車旅\n#輪行";
const SHARE_FILE = "jitensha-tabi-3d.gif";
const X_INTENT = "https://x.com/intent/post?text=" + encodeURIComponent(SHARE_TEXT);
let shareGifP = null, shareBusy = false;
function loadShareGif(){
  if(!shareGifP) shareGifP = fetch("share/3d-viewer.gif").then(r => r.ok ? r.blob() : Promise.reject(new Error("gif"))).catch(e => { shareGifP = null; throw e; });
  return shareGifP;
}
function shareSay(t){ const m = document.getElementById("share-msg"); if(!m) return; m.textContent = t; m.hidden = !t; if(!t || !/保存しました/.test(t)){ const p = document.getElementById("share-prev"); if(p) p.hidden = true; } }
async function shareX(){
  if(shareBusy) return; shareBusy = true;
  const text = SHARE_TEXT;
  let copied = false;
  try{ await navigator.clipboard.writeText(text); copied = true; }catch(e){}
  const CP = copied ? "文章をコピーしました。Xの投稿欄が空のときは、長押しで貼り付けてください。" : "";
  try{
    shareSay("GIFを準備しています…");
    let blob = null;
    try{ blob = await loadShareGif(); }catch(e){}
    if(!blob){ shareSay("GIFを読み込めませんでした。通信を確認して、もう一度押してください。"); return; }
    const file = new File([blob], SHARE_FILE, { type:"image/gif" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try{ await navigator.share({ files:[file], text }); shareSay(CP); return; }
      catch(e){
        if(e && e.name === "AbortError"){ shareSay(CP); return; }
        if(e && e.name === "NotAllowedError"){ shareSay("準備ができました。もう一度ボタンを押してください。"); return; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = SHARE_FILE;
    document.body.appendChild(a); a.click(); a.remove();
    /* 別ウィンドウで開く: こちらの画面のGIFを、投稿画面へドラッグしやすくするため */
    window.open(X_INTENT, "x-share", "popup=yes,width=620,height=760,noopener");
    const prev = document.getElementById("share-prev");
    if(prev){
      if(prev.dataset.url) URL.revokeObjectURL(prev.dataset.url);
      const im = new Image(); im.src = url; im.width = 160; im.alt = "共有用のGIF(投稿欄へドラッグできます)"; im.draggable = true;
      prev.dataset.url = url; prev.replaceChildren(im); prev.hidden = false;
    }
    shareSay("Xの投稿画面は、GIFが自動では付きません。GIFを保存しました(ダウンロードフォルダ)。投稿画面の画像アイコンから保存したGIFを選ぶか、下のGIFを投稿欄へドラッグしてください。");
  }catch(e){ shareSay("共有できませんでした。もう一度お試しください。"); }
  finally{ shareBusy = false; }
}

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.textContent = "";
  [{id:"all",label:"すべて"}].concat(activeKinds()).forEach(k=>{
    const b = el("button","tab",k.label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.filter === k.id));
    b.addEventListener("click",()=>{ state.filter = k.id; renderTabs(); renderMain(); });
    nav.appendChild(b);
  });
  /* Xで共有する(押すと X の投稿画面が開く。投稿するかどうかはその画面で決める) */
  const x = el("a","tab-x");
  x.href = X_INTENT;   /* JS が動かないときの予備(文章とリンクだけの投稿画面)。通常は下の shareX() が GIF つきで共有する */
  x.target = "_blank"; x.rel = "noopener noreferrer"; x.setAttribute("aria-label","Xで共有する(GIFつき)");
  x.addEventListener("click", e=>{ e.preventDefault(); shareX(); });
  ["pointerdown","focus","mouseenter"].forEach(ev => x.addEventListener(ev, loadShareGif, {passive:true, once:true}));
  const xi = new Image(); xi.src = "../img/x-icon.webp"; xi.width = 64; xi.height = 65; xi.alt = "";
  x.appendChild(xi);
  nav.appendChild(x);
}

function renderMain(){
  const main = document.getElementById("main");
  main.textContent = "";
  activeKinds().forEach(k=>{
    if(state.filter !== "all" && state.filter !== k.id) return;
    const items = ITEMS.filter(i => i.kind === k.id);
    const sec = el("section");
    sec.dataset.kind = k.id;
    if(k.id === "album"){
      const head = el("div","sec-head");
      head.appendChild(el("h2",null,k.label));
      const sh = el("button","shuffle-btn","写真をシャッフルする");
      sh.type = "button";
      sh.addEventListener("click",()=>{
        const old = sec.querySelector(".album-grid");
        if(old) old.replaceWith(buildAlbum());
      });
      head.appendChild(sh);
      sec.appendChild(head);
    }else{
      sec.appendChild(el("h2",null,k.heading || k.label));
    }
    if(k.id === "viewer"){
      sec.appendChild(buildViewer());
    }else if(k.id === "album"){
      sec.appendChild(buildAlbum());
    }else if(k.id === "note"){
      sec.appendChild(buildNote());
    }else if(items.length === 0){
      sec.appendChild(el("p","empty","まだリンクがありません。"));
    }else{
      const g = el("div","grid");
      if(k.id === "youtube" && items.some(i => i.main)) g.classList.add("feature");
      items.forEach(i => g.appendChild(buildCard(i)));
      sec.appendChild(g);
    }
    main.appendChild(sec);
  });
}

/* 「設定」ボタンは、設定画面でトークンを保存した端末(ブラウザ)にだけ表示する */
try{ if(localStorage.getItem("ura-note-admin") === "1") document.querySelector(".settings-link").hidden = false; }catch(e){}

/* 写真の一覧を読み込んでから表示する(note の埋め込みを何度も読み直さないため) */
Promise.all([loadAlbum(), loadNotes()]).then(()=>{ fillNoteGrid(); renderTabs(); renderMain(); (window.requestIdleCallback || (f=>setTimeout(f,1200)))(loadNoteScript); });
</script>
</body>
