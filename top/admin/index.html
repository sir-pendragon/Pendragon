<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>設定 | デザイナーズ『裏』ノート</title>
<style>
  :root{
    --bg:#2a1f17; --card:#43331f; --line:#6b5236;
    --text:#f3e8d4; --muted:#bfae92; --accent:#e0b25a; --danger:#e5483f; --ok:#4fb8a0;
    --gap:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  a{color:var(--accent)}
  h1{font-size:20px;margin:12px 0 4px}
  h2{font-size:17px;margin:0 0 10px;padding-left:12px;border-left:4px solid #c9488a}
  p.note{color:var(--muted);font-size:13px;margin:4px 0 12px}
  section{margin:22px 0;padding:14px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:10px}
  button{font:inherit;color:inherit;cursor:pointer}
  .btn{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  input[type=password],input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#1d150f;color:var(--text);font:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .grid{display:grid;gap:var(--gap);grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
  .item{position:relative;display:block;padding:0;border:3px solid transparent;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#1d150f}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item .mark{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:#fff}
  .item.sel{border-color:var(--danger)}
  .item.sel img{opacity:.45}
  .item.sel .mark{background:var(--danger);border-color:var(--danger)}
  .msg{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px}
  .msg.ok{background:rgba(79,184,160,.18);border:1px solid var(--ok)}
  .msg.err{background:rgba(229,72,63,.18);border:1px solid var(--danger)}
  .confirm{margin-top:12px;padding:12px;border:1px solid var(--danger);border-radius:10px;background:rgba(229,72,63,.12)}
  .confirm[hidden],.msg[hidden],section[hidden]{display:none}
  details{margin-top:10px;color:var(--muted);font-size:13px}
  details ol{margin:6px 0 0;padding-left:20px}
  code{background:#1d150f;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <p><a href="../">← 「裏」ノートにもどる</a></p>
  <h1>設定</h1>
  <p class="note">この画面は、Cloudflare Access で守られた自分専用の画面です。</p>

  <section id="albumSec">
    <h2>掲載済みの写真 <span id="count" class="note" style="margin:0"></span></h2>
    <p class="note">削除したい写真を押して選び(赤くなります)、「選んだ写真を削除」を押してください。</p>
    <div class="grid" id="grid"></div>
    <div class="row">
      <button class="btn danger" id="delBtn" type="button" disabled>選んだ写真を削除</button>
      <button class="btn" id="clearSel" type="button" disabled>選択を解除</button>
    </div>
    <div class="confirm" id="confirm" hidden>
      <div id="confirmText"></div>
      <div class="row">
        <button class="btn danger" id="doDel" type="button">削除する</button>
        <button class="btn" id="cancelDel" type="button">やめる</button>
      </div>
    </div>
    <div class="msg" id="msg" hidden role="status"></div>
  </section>

  <p class="note"><button class="btn" id="hideBtn" type="button">この端末の「設定」ボタンを消す</button></p>
</div>

<script>
const FLAG = "ura-note-admin";       // この端末の TOP に「設定」ボタンを出すための印
const OK_NAME = /^album\/[A-Za-z0-9_-]+\.jpg$/;

const $ = id => document.getElementById(id);
let photos = [];                     // 表示中の一覧
const selected = new Set();

/* 管理画面を開けた(= Access のログインを通った)端末にだけ、TOP の「設定」ボタンを出す */
try{ localStorage.setItem(FLAG,"1"); }catch(e){}

function showMsg(text, kind){
  const m = $("msg"); m.textContent = text; m.className = "msg " + kind; m.hidden = false;
}
function thumbOf(f){ return "../" + f.replace("album/","album/t/"); }

/* ---------- 一覧の表示 ---------- */
function render(){
  const g = $("grid"); g.textContent = "";
  photos.forEach(f=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "item" + (selected.has(f) ? " sel" : "");
    b.setAttribute("aria-pressed", selected.has(f) ? "true" : "false");
    b.setAttribute("aria-label", f + (selected.has(f) ? "(削除に選択中)" : ""));
    const im = new Image(); im.src = thumbOf(f); im.alt = ""; im.loading = "lazy";
    const mk = document.createElement("span"); mk.className = "mark"; mk.textContent = selected.has(f) ? "✓" : "";
    b.append(im, mk);
    b.addEventListener("click",()=>{ selected.has(f) ? selected.delete(f) : selected.add(f); $("confirm").hidden = true; render(); });
    g.appendChild(b);
  });
  $("count").textContent = "(" + photos.length + "枚)";
  $("delBtn").disabled = selected.size === 0;
  $("clearSel").disabled = selected.size === 0;
}

function loadList(){
  return fetch("../album/album.json?t=" + Date.now(),{cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject(new Error("一覧を読み込めませんでした")))
    .then(a => { photos = a.filter(f => typeof f === "string" && OK_NAME.test(f)); selected.clear(); render(); })
    .catch(e => showMsg(e.message, "err"));
}

/* ---------- 削除(Access で守られた API を呼ぶ。GitHub への書き込みはサーバー側) ---------- */
async function deleteOnServer(names){
  const r = await fetch("api/delete",{ method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ names }) });
  const j = await r.json().catch(()=> ({}));
  if(!r.ok){ const e = new Error(j.error || ("http " + r.status)); e.status = r.status; e.code = j.error; e.gh = j.status; e.remain = j.remain; throw e; }
  return j;
}

function explain(e){
  if(e.code === "none") return "選んだ写真は、すでに一覧から消えていました。一覧を読み込み直します。";
  if(e.code === "not_configured") return "サーバー側の設定(GITHUB_TOKEN)がまだ入っていません。Cloudflare Pages の環境変数に登録してください。";
  if(e.status === 403 || e.status === 401) return "ログインが切れたか、サーバー側の設定(ACCESS_AUD)が合っていません。ページを読み込み直して、もう一度お試しください。";
  if(e.code === "github") return "GitHub への書き込みに失敗しました。トークンの権限(Contents: Read and write)と期限を確認してください。(" + (e.gh || "?") + ")";
  return "削除できませんでした。通信を確認して、もう一度お試しください。(" + (e.status || e.message) + ")";
}

/* ---------- 操作 ---------- */
$("clearSel").addEventListener("click",()=>{ selected.clear(); $("confirm").hidden = true; render(); });
$("hideBtn").addEventListener("click",()=>{ try{ localStorage.removeItem(FLAG); }catch(e){} showMsg("この端末の TOP から「設定」ボタンを消しました。この画面を開くと、また表示されます。", "ok"); });
$("delBtn").addEventListener("click",()=>{
  $("confirmText").textContent = selected.size + "枚の写真を削除します。公開中のアルバムからも消えます(GitHubの履歴からは復元できます)。よろしいですか?";
  $("confirm").hidden = false; $("msg").hidden = true;
});
$("cancelDel").addEventListener("click",()=>{ $("confirm").hidden = true; });
$("doDel").addEventListener("click", async ()=>{
  const names = Array.from(selected);
  $("doDel").disabled = true; $("cancelDel").disabled = true;
  showMsg("削除しています…", "ok");
  try{
    const r = await deleteOnServer(names);
    photos = r.remain; selected.clear(); $("confirm").hidden = true; render();
    showMsg(r.deleted.length + "枚を削除しました。公開サイトへの反映には1〜2分ほどかかります。", "ok");
  }catch(e){
    showMsg(explain(e), "err");
    if(e.code === "none"){ selected.clear(); $("confirm").hidden = true; loadList(); }
  }finally{
    $("doDel").disabled = false; $("cancelDel").disabled = false;
  }
});

loadList();
</script>
</body>
</html>
